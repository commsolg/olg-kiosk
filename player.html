<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>OLG Kiosk Player</title>

  <style>
    html, body {
      width: 100%;
      height: 100%;
      margin: 0;
      padding: 0;
      overflow: hidden;
      background: #000;
    }

    #screen {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      border: 0;
      display: block;
      background: #fff;
    }

    #status {
      position: fixed;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #3a3e42;
      color: #ffffff;
      font-family: Arial, sans-serif;
      font-size: 24px;
      z-index: 10;
    }
  </style>
</head>

<body>

  <div id="status">Loading OLG Kiosk...</div>

  <iframe
    id="screen"
    title="OLG Kiosk Content"
    allow="autoplay; fullscreen"
  ></iframe>

  <script type="module">

    import { initializeApp }
      from "https://www.gstatic.com/firebasejs/12.19.0/firebase-app.js";

    import {
      getDatabase,
      ref,
      onValue,
      get
    }
    from "https://www.gstatic.com/firebasejs/12.19.0/firebase-database.js";


    // ==========================================
    // FIREBASE
    // ==========================================

    const firebaseConfig = {
      apiKey: "AIzaSyBXJxs6cFXJVCfDuFPhZFpK34N1HiHqMy8",
      authDomain: "olg-kiosk-control.firebaseapp.com",
      databaseURL: "https://olg-kiosk-control-default-rtdb.firebaseio.com",
      projectId: "olg-kiosk-control",
      storageBucket: "olg-kiosk-control.firebasestorage.app",
      messagingSenderId: "1060266581212",
      appId: "1:1060266581212:web:0475a741bc19fb45f9e819"
    };


    const app = initializeApp(firebaseConfig);
    const database = getDatabase(app);


    // ==========================================
    // KIOSK PAGES
    // ==========================================

    const pages = {

      homepage:
        "https://commsolg.github.io/olg-kiosk/",

      slideshow:
        "https://docs.google.com/presentation/d/e/2PACX-1vTQxxSHZe9BlXLFHPyk7HStdfkBI_p2fvKi2zYDUV6zz4V5FOZb-CNzHaXg8FeyDzeaPGpEUal26u_g/embed?start=true&loop=true&delayms=15000",

      thermometer:
        "https://script.google.com/macros/s/AKfycbwPN6qTrEB2gXbYoceUsNZG6xSfBAQXzJ3XY8aYDHZZn2iooqsAUtArrR_UoIPADP58Lw/exec"

    };


    const screen =
      document.getElementById("screen");

    const status =
      document.getElementById("status");

    let currentScreen = "";


    // ==========================================
    // DISPLAY A SCREEN
    // ==========================================

    function showScreen(name) {

      const selected =
        pages[name] ? name : "homepage";

      const url =
        pages[selected];

      if (currentScreen === selected) {
        return;
      }

      currentScreen = selected;

      status.style.display = "flex";
      status.textContent = "Loading OLG Kiosk...";

      screen.src = url;

      screen.onload = () => {
        status.style.display = "none";
      };

    }


    // ==========================================
    // MASS SCHEDULE
    // ==========================================

    const massSchedule = {

      // Sunday
      0: [
        { time: "07:30", type: "weekend" },
        { time: "09:30", type: "weekend" },
        { time: "11:30", type: "weekend" },
        { time: "13:30", type: "weekend" },
        { time: "15:30", type: "weekend" }
      ],

      // Monday
      1: [
        { time: "08:30", type: "daily" }
      ],

      // Tuesday
      2: [
        { time: "08:30", type: "daily" },
        { time: "18:30", type: "daily" }
      ],

      // Wednesday
      3: [
        { time: "08:30", type: "daily" },
        { time: "12:10", type: "daily" }
      ],

      // Thursday
      4: [
        { time: "08:30", type: "daily" }
      ],

      // Friday
      5: [
        { time: "08:30", type: "daily" }
      ],

      // Saturday
      6: [
        { time: "08:30", type: "daily" },
        { time: "16:30", type: "weekend" },
        { time: "18:30", type: "weekend" }
      ]

    };


    // ==========================================
    // DETERMINE AUTOMATIC SCREEN
    // ==========================================

    function getScheduledScreen() {

      const now = new Date();

      const day =
        now.getDay();

      const currentMinutes =
        now.getHours() * 60 +
        now.getMinutes();

      const masses =
        massSchedule[day] || [];


      for (const mass of masses) {

        const [hour, minute] =
          mass.time.split(":").map(Number);

        const massMinutes =
          hour * 60 + minute;


        if (mass.type === "weekend") {

          const slideshowStart =
            massMinutes - 60;

          const slideshowEnd =
            massMinutes + 30;

          if (
            currentMinutes >= slideshowStart &&
            currentMinutes < slideshowEnd
          ) {
            return "slideshow";
          }
        }


        if (mass.type === "daily") {

          const slideshowStart =
            massMinutes - 30;

          const slideshowEnd =
            massMinutes + 15;

          if (
            currentMinutes >= slideshowStart &&
            currentMinutes < slideshowEnd
          ) {
            return "slideshow";
          }
        }
      }


      return "homepage";
    }


    // ==========================================
    // APPLY AUTOMATIC SCHEDULE
    // ==========================================

    async function applyAutomaticSchedule() {

      try {

        const modeSnapshot =
          await get(
            ref(database, "kiosk/mode")
          );

        const mode =
          modeSnapshot.val() || "automatic";


        if (mode === "manual") {

          const screenSnapshot =
            await get(
              ref(database, "kiosk/screen")
            );

          const manualScreen =
            screenSnapshot.val() || "homepage";

          showScreen(manualScreen);

          return;
        }


        const scheduledScreen =
          getScheduledScreen();

        showScreen(scheduledScreen);


      } catch (error) {

        console.error(
          "Kiosk schedule error:",
          error
        );


        if (!currentScreen) {
          showScreen("homepage");
        }

      }

    }


    // ==========================================
    // LIVE FIREBASE LISTENERS
    // ==========================================

    onValue(
      ref(database, "kiosk/mode"),
      () => {
        applyAutomaticSchedule();
      }
    );


    onValue(
      ref(database, "kiosk/screen"),
      async (snapshot) => {

        try {

          const modeSnapshot =
            await get(
              ref(database, "kiosk/mode")
            );

          const mode =
            modeSnapshot.val() || "automatic";


          if (mode === "manual") {

            const selectedScreen =
              snapshot.val() || "homepage";

            showScreen(selectedScreen);

          }

        } catch (error) {

          console.error(
            "Manual screen error:",
            error
          );

        }

      }
    );


    // ==========================================
    // START KIOSK
    // ==========================================

    applyAutomaticSchedule();


    setInterval(
      applyAutomaticSchedule,
      30000
    );


  </script>

</body>
</html>
