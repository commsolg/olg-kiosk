<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>OLG Kiosk Player</title>

  <style>
    html, body {
      width: 100%;
      height: 100%;
      margin: 0;
      padding: 0;
      overflow: hidden;
      background: #000;
    }

    #screen {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      border: 0;
      display: block;
      background: #fff;
    }

    #status {
      position: fixed;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #3a3e42;
      color: #ffffff;
      font-family: Arial, sans-serif;
      font-size: 24px;
      z-index: 10;
    }
  </style>
</head>

<body>

  <div id="status">Loading OLG Kiosk...</div>

  <iframe
    id="screen"
    title="OLG Kiosk Content"
    allow="autoplay; fullscreen"
  ></iframe>

  <script type="module">

    import { initializeApp }
      from "https://www.gstatic.com/firebasejs/12.19.0/firebase-app.js";

    import {
      getDatabase,
      ref,
      onValue,
      get
    }
    from "https://www.gstatic.com/firebasejs/12.19.0/firebase-database.js";


    // ==========================================
    // FIREBASE
    // ==========================================

    const firebaseConfig = {
      apiKey: "AIzaSyBXJxs6cFXJVCfDuFPhZFpK34N1HiHqMy8",
      authDomain: "olg-kiosk-control.firebaseapp.com",
      databaseURL: "https://olg-kiosk-control-default-rtdb.firebaseio.com",
      projectId: "olg-kiosk-control",
      storageBucket: "olg-kiosk-control.firebasestorage.app",
      messagingSenderId: "1060266581212",
      appId: "1:1060266581212:web:0475a741bc19fb45f9e819"
    };


    const app = initializeApp(firebaseConfig);
    const database = getDatabase(app);


    // ==========================================
    // KIOSK PAGES
    // ==========================================

    const pages = {

      homepage:
        "https://commsolg.github.io/olg-kiosk/",

      slideshow:
        "https://docs.google.com/presentation/d/e/2PACX-1vTQxxSHZe9BlXLFHPyk7HStdfkBI_p2fvKi2zYDUV6zz4V5FOZb-CNzHaXg8FeyDzeaPGpEUal26u_g/embed?start=true&loop=true&delayms=15000",

      thermometer:
        "https://script.google.com/macros/s/AKfycbxmqh5wvGYeaxEqPv-RtquLgrGdT-rFV1nEAcmvMB64vF904yFyceCzuowvC5zRwop8vA/exec"

    };


    const screen =
      document.getElementById("screen");

    const status =
      document.getElementById("status");

    let currentScreen = "";


    // ==========================================
    // DISPLAY A SCREEN
    // ==========================================

    function showScreen(name) {

      const selected =
        pages[name] ? name : "homepage";

      const url =
        pages[selected];

      if (currentScreen === selected) {
        return;
      }

      currentScreen = selected;

      status.style.display = "flex";
      status.textContent = "Loading OLG Kiosk...";

      screen.src = url;

      screen.onload = () => {
        status.style.display = "none";
      };

    }


    // ==========================================
    // MASS SCHEDULE
    // ==========================================

    const massSchedule = {

      // Sunday
      0: [
        "07:30",
        "09:30",
        "11:30",
        "13:30",
        "15:30"
      ],

      // Monday
      1: [
        "08:30"
      ],

      // Tuesday
      2: [
        "08:30",
        "18:30"
      ],

      // Wednesday
      3: [
        "08:30",
        "12:10"
      ],

      // Thursday
      4: [
        "08:30"
      ],

      // Friday
      5: [
        "08:30"
      ],

      // Saturday
      6: [
        "08:30",
        "16:30",
        "18:30"
      ]

    };


    // ==========================================
    // DETERMINE AUTOMATIC SCREEN
    // ==========================================

    function getScheduledScreen() {

      const now = new Date();

      const day =
        now.getDay();

      const currentMinutes =
        now.getHours() * 60 +
        now.getMinutes();

      const masses =
        massSchedule[day] || [];


      for (const mass of masses) {

        const [hour, minute] =
          mass.split(":").map(Number);

        const massMinutes =
          hour * 60 + minute;

        const slideshowStart =
          massMinutes - 60;

        const slideshowEnd =
          massMinutes + 30;


        // Slideshow:
        // 1 hour before Mass
        // through 30 minutes after Mass begins

        if (
          currentMinutes >= slideshowStart &&
          currentMinutes < slideshowEnd
        ) {

          return "slideshow";

        }

      }


      // Everywhere else:
      return "homepage";

    }


    // ==========================================
    // APPLY AUTOMATIC SCHEDULE
    // ==========================================

    async function applyAutomaticSchedule() {

      try {

        const modeSnapshot =
          await get(
            ref(database, "kiosk/mode")
          );

        const mode =
          modeSnapshot.val() || "automatic";


        // If manual mode is active,
        // Firebase controls the screen.

        if (mode === "manual") {

          const screenSnapshot =
            await get(
              ref(database, "kiosk/screen")
            );

          const manualScreen =
            screenSnapshot.val() || "homepage";

          showScreen(manualScreen);

          return;

        }


        // Otherwise follow Mass schedule.

        const scheduledScreen =
          getScheduledScreen();

        showScreen(scheduledScreen);


      } catch (error) {

        console.error(
          "Kiosk schedule error:",
          error
        );

        // Safe fallback
        if (!currentScreen) {
          showScreen("homepage");
        }

      }

    }


    // ==========================================
    // LIVE FIREBASE LISTENERS
    // ==========================================

    // If mode changes, respond immediately.

    onValue(
      ref(database, "kiosk/mode"),
      () => {

        applyAutomaticSchedule();

      }
    );


    // If a manual screen changes,
    // respond immediately.

    onValue(
      ref(database, "kiosk/screen"),
      async (snapshot) => {

        try {

          const modeSnapshot =
            await get(
              ref(database, "kiosk/mode")
            );

          const mode =
            modeSnapshot.val() || "automatic";


          if (mode === "manual") {

            const selectedScreen =
              snapshot.val() || "homepage";

            showScreen(selectedScreen);

          }

        } catch (error) {

          console.error(
            "Manual screen error:",
            error
          );

        }

      }
    );


    // ==========================================
    // START KIOSK
    // ==========================================

    // Run immediately.
    applyAutomaticSchedule();


    // Re-check the Mass schedule every 30 seconds.
    setInterval(
      applyAutomaticSchedule,
      30000
    );


  </script>

</body>
</html>
