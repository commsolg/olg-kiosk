<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>OLG Kiosk Player</title>

  <style>
    html, body {
      width: 100%;
      height: 100%;
      margin: 0;
      padding: 0;
      overflow: hidden;
      background: #000;
    }

    #screen {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      border: 0;
      display: block;
      background: #fff;
    }

    #status {
      position: fixed;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #3a3e42;
      color: #ffffff;
      font-family: Arial, sans-serif;
      font-size: 24px;
      z-index: 10;
    }
  </style>
</head>

<body>

  <div id="status">Loading OLG Kiosk...</div>

  <iframe
    id="screen"
    title="OLG Kiosk Content"
    allow="autoplay; fullscreen"
  ></iframe>


  <script type="module">

    import { initializeApp }
      from "https://www.gstatic.com/firebasejs/12.19.0/firebase-app.js";

    import {
      getDatabase,
      ref,
      onValue,
      get
    }
    from "https://www.gstatic.com/firebasejs/12.19.0/firebase-database.js";


    // ==========================================
    // FIREBASE
    // ==========================================

    const firebaseConfig = {
      apiKey: "AIzaSyBXJxs6cFXJVCfDuFPhZFpK34N1HiHqMy8",
      authDomain: "olg-kiosk-control.firebaseapp.com",
      databaseURL: "https://olg-kiosk-control-default-rtdb.firebaseio.com",
      projectId: "olg-kiosk-control",
      storageBucket: "olg-kiosk-control.firebasestorage.app",
      messagingSenderId: "1060266581212",
      appId: "1:1060266581212:web:0475a741bc19fb45f9e819"
    };


    const app = initializeApp(firebaseConfig);
    const database = getDatabase(app);


    // ==========================================
    // KIOSK PAGES
    // ==========================================

    const pages = {

      homepage:
        "https://commsolg.github.io/olg-kiosk/",

      slideshow:
        "https://docs.google.com/presentation/d/e/2PACX-1vTQxxSHZe9BlXLFHPyk7HStdfkBI_p2fvKi2zYDUV6zz4V5FOZb-CNzHaXg8FeyDzeaPGpEUal26u_g/embed?start=true&loop=true&delayms=15000",

      thermometer:
        "https://script.google.com/macros/s/AKfycbwWqXN8FbAE6qqvdZrUfoCS7ugcalRamfcILSFFGZS0xGlf7fDrMPOhEii__oKiLKFNmA/exec"

    };


    const screen =
      document.getElementById("screen");

    const status =
      document.getElementById("status");

    let currentScreen = "";


    // ==========================================
    // DISPLAY A SCREEN
    // ==========================================

    function showScreen(name) {

      const selected =
        pages[name] ? name : "homepage";

      const url =
        pages[selected];

      // Do not reload the same screen unnecessarily.
      if (currentScreen === selected) {
        return;
      }

      currentScreen = selected;

      status.style.display = "flex";
      status.textContent = "Loading OLG Kiosk...";

      screen.src = url;

      screen.onload = () => {
        status.style.display = "none";
      };

    }


    // ==========================================
    // MASS SCHEDULE
    // ==========================================
    //
    // IMPORTANT:
    // Times below use a 24-hour clock.
    //
    // Examples:
    // 07:30 = 7:30 AM
    // 08:30 = 8:30 AM
    // 12:10 = 12:10 PM
    // 13:30 = 1:30 PM
    // 15:30 = 3:30 PM
    // 16:30 = 4:30 PM
    // 18:30 = 6:30 PM
    //
    // "weekend":
    // slideshow begins 60 minutes before Mass
    // and ends 30 minutes after Mass begins.
    //
    // "daily":
    // slideshow begins 30 minutes before Mass
    // and ends 15 minutes after Mass begins.
    // ==========================================

    const massSchedule = {

      // ========================================
      // SUNDAY
      // ========================================
      0: [

        // 7:30 AM
        {
          time: "07:30",
          type: "weekend"
        },

        // 9:30 AM
        {
          time: "09:30",
          type: "weekend"
        },

        // 11:30 AM
        {
          time: "11:30",
          type: "weekend"
        },

        // 1:30 PM - Spanish
        {
          time: "13:30",
          type: "weekend"
        },

        // 3:30 PM
        {
          time: "15:30",
          type: "weekend"
        }

      ],


      // ========================================
      // MONDAY
      // ========================================
      1: [

        // 8:30 AM
        {
          time: "08:30",
          type: "daily"
        }

      ],


      // ========================================
      // TUESDAY
      // ========================================
      2: [

        // 8:30 AM - Spanish
        {
          time: "08:30",
          type: "daily"
        },

        // 6:30 PM
        {
          time: "18:30",
          type: "daily"
        }

      ],


      // ========================================
      // WEDNESDAY
      // ========================================
      3: [

        // 8:30 AM
        {
          time: "08:30",
          type: "daily"
        },

        // 12:10 PM
        {
          time: "12:10",
          type: "daily"
        }

      ],


      // ========================================
      // THURSDAY
      // ========================================
      4: [

        // 8:30 AM
        {
          time: "08:30",
          type: "daily"
        }

      ],


      // ========================================
      // FRIDAY
      // ========================================
      5: [

        // 8:30 AM
        {
          time: "08:30",
          type: "daily"
        }

      ],


      // ========================================
      // SATURDAY
      // ========================================
      6: [

        // 8:30 AM Daily Mass
        {
          time: "08:30",
          type: "daily"
        },

        // 4:30 PM Sunday Vigil Mass
        {
          time: "16:30",
          type: "weekend"
        },

        // 6:30 PM Spanish Sunday Vigil Mass
        {
          time: "18:30",
          type: "weekend"
        }

      ]

    };


    // ==========================================
    // GET SAN ANTONIO TIME
    // ==========================================
    //
    // We DO NOT use the kiosk's local timezone
    // for scheduling.
    //
    // America/Chicago is the timezone used in
    // San Antonio, Texas.
    //
    // The browser automatically switches between:
    //
    // CST = Central Standard Time
    // CDT = Central Daylight Time
    //
    // This prevents the schedule from changing
    // if the Android device has the wrong timezone.
    // ==========================================

    function getSanAntonioTime() {

      const parts =
        new Intl.DateTimeFormat(
          "en-US",
          {
            timeZone: "America/Chicago",
            weekday: "short",
            hour: "2-digit",
            minute: "2-digit",
            second: "2-digit",
            hourCycle: "h23"
          }
        ).formatToParts(new Date());


      const values = {};


      for (const part of parts) {

        if (part.type !== "literal") {
          values[part.type] = part.value;
        }

      }


      const dayNumbers = {
        Sun: 0,
        Mon: 1,
        Tue: 2,
        Wed: 3,
        Thu: 4,
        Fri: 5,
        Sat: 6
      };


      return {

        day:
          dayNumbers[values.weekday],

        hour:
          Number(values.hour),

        minute:
          Number(values.minute),

        second:
          Number(values.second)

      };

    }


    // ==========================================
    // DETERMINE AUTOMATIC SCREEN
    // ==========================================

    function getScheduledScreen() {

      const sanAntonio =
        getSanAntonioTime();


      const day =
        sanAntonio.day;


      const currentMinutes =
        sanAntonio.hour * 60 +
        sanAntonio.minute;


      const masses =
        massSchedule[day] || [];


      // Check every Mass scheduled today.
      for (const mass of masses) {


        const [hour, minute] =
          mass.time
            .split(":")
            .map(Number);


        const massMinutes =
          hour * 60 +
          minute;


        // ======================================
        // WEEKEND MASS
        // ======================================
        //
        // Slideshow:
        // 60 minutes BEFORE Mass
        // through
        // 30 minutes AFTER Mass begins.
        // ======================================

        if (mass.type === "weekend") {


          const slideshowStart =
            massMinutes - 60;


          const slideshowEnd =
            massMinutes + 30;


          if (
            currentMinutes >= slideshowStart &&
            currentMinutes < slideshowEnd
          ) {

            return "slideshow";

          }

        }


        // ======================================
        // DAILY MASS
        // ======================================
        //
        // Slideshow:
        // 30 minutes BEFORE Mass
        // through
        // 15 minutes AFTER Mass begins.
        // ======================================

        if (mass.type === "daily") {


          const slideshowStart =
            massMinutes - 30;


          const slideshowEnd =
            massMinutes + 15;


          if (
            currentMinutes >= slideshowStart &&
            currentMinutes < slideshowEnd
          ) {

            return "slideshow";

          }

        }

      }


      // If there is no Mass window active,
      // display the interactive homepage.

      return "homepage";

    }


    // ==========================================
    // APPLY AUTOMATIC SCHEDULE
    // ==========================================

    async function applyAutomaticSchedule() {

      try {


        // First check whether the kiosk is
        // currently in automatic or manual mode.

        const modeSnapshot =
          await get(
            ref(
              database,
              "kiosk/mode"
            )
          );


        const mode =
          modeSnapshot.val() ||
          "automatic";


        // ======================================
        // MANUAL MODE
        // ======================================

        if (mode === "manual") {


          const screenSnapshot =
            await get(
              ref(
                database,
                "kiosk/screen"
              )
            );


          const manualScreen =
            screenSnapshot.val() ||
            "homepage";


          showScreen(
            manualScreen
          );


          return;

        }


        // ======================================
        // AUTOMATIC MODE
        // ======================================

        const scheduledScreen =
          getScheduledScreen();


        showScreen(
          scheduledScreen
        );


      } catch (error) {


        console.error(
          "Kiosk schedule error:",
          error
        );


        // If Firebase cannot be reached when
        // the kiosk first loads, safely show
        // the homepage instead of a blank screen.

        if (!currentScreen) {

          showScreen(
            "homepage"
          );

        }

      }

    }


    // ==========================================
    // LIVE FIREBASE LISTENER:
    // MODE
    // ==========================================
    //
    // This allows the controller to immediately
    // switch between:
    //
    // AUTOMATIC
    // MANUAL
    // ==========================================

    onValue(

      ref(
        database,
        "kiosk/mode"
      ),

      () => {

        applyAutomaticSchedule();

      }

    );


    // ==========================================
    // LIVE FIREBASE LISTENER:
    // MANUAL SCREEN
    // ==========================================
    //
    // If manual mode is active, changes from
    // control.html immediately change the kiosk.
    // ==========================================

    onValue(

      ref(
        database,
        "kiosk/screen"
      ),

      async (snapshot) => {


        try {


          const modeSnapshot =
            await get(
              ref(
                database,
                "kiosk/mode"
              )
            );


          const mode =
            modeSnapshot.val() ||
            "automatic";


          if (mode === "manual") {


            const selectedScreen =
              snapshot.val() ||
              "homepage";


            showScreen(
              selectedScreen
            );

          }


        } catch (error) {


          console.error(
            "Manual screen error:",
            error
          );


        }

      }

    );


    // ==========================================
    // START KIOSK
    // ==========================================

    applyAutomaticSchedule();


    // ==========================================
    // CHECK SCHEDULE EVERY 30 SECONDS
    // ==========================================
    //
    // This means the kiosk will automatically
    // change screens within approximately
    // 30 seconds of a scheduled transition.
    // ==========================================

    setInterval(
      applyAutomaticSchedule,
      30000
    );


  </script>

</body>
</html>
