<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>OLG Kiosk Control</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: Arial, sans-serif;
      background: #f8f6f1;
      color: #3a3e42;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 30px;
    }

    .panel {
      width: 100%;
      max-width: 620px;
      background: white;
      border-radius: 24px;
      padding: 40px;
      box-shadow: 0 12px 40px rgba(0,0,0,.12);
    }

    h1 {
      margin: 0 0 8px;
      font-size: 34px;
    }

    .subtitle {
      color: #777;
      margin-bottom: 30px;
    }

    input {
      width: 100%;
      padding: 15px;
      margin-bottom: 12px;
      border: 1px solid #ccc;
      border-radius: 10px;
      font-size: 16px;
    }

    button {
      width: 100%;
      padding: 17px;
      margin-top: 12px;
      border: 0;
      border-radius: 12px;
      font-size: 18px;
      font-weight: bold;
      cursor: pointer;
    }

    .login {
      background: #584d52;
      color: white;
    }

    .homepage {
      background: #3a3e42;
      color: white;
    }

    .slideshow {
      background: #a48868;
      color: white;
    }

    .thermometer {
      background: #218686;
      color: white;
    }

    .automatic {
      background: #b7cedb;
      color: #3a3e42;
    }

    .logout {
      background: #eee;
      color: #555;
      margin-top: 25px;
    }

    #controls {
      display: none;
    }

    #message {
      text-align: center;
      margin-top: 18px;
      font-weight: bold;
    }

    .current {
      background: #f1ede4;
      padding: 18px;
      border-radius: 12px;
      margin-bottom: 20px;
      text-align: center;
    }

    .current strong {
      display: block;
      font-size: 22px;
      margin-top: 5px;
    }

    .mode {
      margin-top: 8px;
      font-size: 14px;
      color: #777;
    }
  </style>
</head>

<body>

<div class="panel">

  <h1>OLG Kiosk Control</h1>
  <div class="subtitle">
    Our Lady of Guadalupe · Helotes, Texas
  </div>

  <div id="loginBox">

    <input
      id="email"
      type="email"
      placeholder="Email"
    >

    <input
      id="password"
      type="password"
      placeholder="Password"
    >

    <button class="login" id="loginButton">
      Sign In
    </button>

  </div>

  <div id="controls">

    <div class="current">
      Currently displaying
      <strong id="currentScreen">Loading...</strong>

      <div class="mode">
        Mode:
        <span id="currentMode">Loading...</span>
      </div>
    </div>

    <button
      class="homepage"
      data-screen="homepage"
    >
      Show Homepage
    </button>

    <button
      class="slideshow"
      data-screen="slideshow"
    >
      Show Slideshow
    </button>

    <button
      class="thermometer"
      data-screen="thermometer"
    >
      Show Building Faith Together
    </button>

    <button
      class="automatic"
      id="automaticButton"
    >
      Use Automatic Schedule
    </button>

    <button
      class="logout"
      id="logoutButton"
    >
      Sign Out
    </button>

  </div>

  <div id="message"></div>

</div>


<script type="module">

  import { initializeApp }
  from "https://www.gstatic.com/firebasejs/12.2.1/firebase-app.js";

  import {
    getDatabase,
    ref,
    set,
    onValue
  }
  from "https://www.gstatic.com/firebasejs/12.2.1/firebase-database.js";

  import {
    getAuth,
    signInWithEmailAndPassword,
    signOut,
    onAuthStateChanged
  }
  from "https://www.gstatic.com/firebasejs/12.2.1/firebase-auth.js";


  const firebaseConfig = {

    apiKey:
      "AIzaSyBXJxs6cFXJVCfDuFPhZFpK34N1HiHqMy8",

    authDomain:
      "olg-kiosk-control.firebaseapp.com",

    databaseURL:
      "https://olg-kiosk-control-default-rtdb.firebaseio.com",

    projectId:
      "olg-kiosk-control",

    storageBucket:
      "olg-kiosk-control.firebasestorage.app",

    messagingSenderId:
      "1060266581212",

    appId:
      "1:1060266581212:web:0475a741bc19fb45f9e819"
  };


  const app = initializeApp(firebaseConfig);
  const database = getDatabase(app);
  const auth = getAuth(app);


  const loginBox =
    document.getElementById("loginBox");

  const controls =
    document.getElementById("controls");

  const message =
    document.getElementById("message");

  const currentScreen =
    document.getElementById("currentScreen");

  const currentMode =
    document.getElementById("currentMode");


  // ==========================================
  // LOGIN
  // ==========================================

  document
    .getElementById("loginButton")
    .addEventListener("click", async () => {

      const email =
        document.getElementById("email").value;

      const password =
        document.getElementById("password").value;

      message.textContent = "Signing in...";

      try {

        await signInWithEmailAndPassword(
          auth,
          email,
          password
        );

        message.textContent = "";

      } catch (error) {

        console.error(error);

        message.textContent =
          "Unable to sign in. Check your email and password.";

      }

    });


  // ==========================================
  // LOGOUT
  // ==========================================

  document
    .getElementById("logoutButton")
    .addEventListener("click", async () => {

      await signOut(auth);

    });


  // ==========================================
  // AUTH STATE
  // ==========================================

  onAuthStateChanged(auth, (user) => {

    if (user) {

      loginBox.style.display = "none";
      controls.style.display = "block";

    } else {

      loginBox.style.display = "block";
      controls.style.display = "none";

    }

  });


  // ==========================================
  // MANUAL SCREEN BUTTONS
  // ==========================================

  document
    .querySelectorAll("[data-screen]")
    .forEach(button => {

      button.addEventListener("click", async () => {

        const screen =
          button.dataset.screen;

        try {

          // Put kiosk into manual mode
          await set(
            ref(database, "kiosk/mode"),
            "manual"
          );

          // Change the screen
          await set(
            ref(database, "kiosk/screen"),
            screen
          );

          message.textContent =
            "Kiosk changed successfully.";

          setTimeout(() => {
            message.textContent = "";
          }, 2000);

        } catch (error) {

          console.error(error);

          message.textContent =
            "Unable to change kiosk.";

        }

      });

    });


  // ==========================================
  // AUTOMATIC MODE BUTTON
  // ==========================================

  document
    .getElementById("automaticButton")
    .addEventListener("click", async () => {

      try {

        await set(
          ref(database, "kiosk/mode"),
          "automatic"
        );

        message.textContent =
          "Automatic schedule enabled.";

        setTimeout(() => {
          message.textContent = "";
        }, 2000);

      } catch (error) {

        console.error(error);

        message.textContent =
          "Unable to enable automatic schedule.";

      }

    });


  // ==========================================
  // CURRENT SCREEN DISPLAY
  // ==========================================

  onValue(
    ref(database, "kiosk/screen"),
    (snapshot) => {

      const screen =
        snapshot.val() || "homepage";

      if (screen === "homepage") {

        currentScreen.textContent =
          "Homepage";

      } else if (screen === "slideshow") {

        currentScreen.textContent =
          "Slideshow";

      } else if (screen === "thermometer") {

        currentScreen.textContent =
          "Building Faith Together";

      } else {

        currentScreen.textContent =
          screen;

      }

    }
  );


  // ==========================================
  // CURRENT MODE DISPLAY
  // ==========================================

  onValue(
    ref(database, "kiosk/mode"),
    (snapshot) => {

      const mode =
        snapshot.val() || "automatic";

      if (mode === "manual") {

        currentMode.textContent =
          "Manual";

      } else {

        currentMode.textContent =
          "Automatic";

      }

    }
  );

</script>

</body>
</html>
