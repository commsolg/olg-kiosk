<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
  >

  <title>OLG Kiosk Slideshow</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #000;
      user-select: none;
      -webkit-user-select: none;
      touch-action: none;
    }

    #slideshow {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #000;
    }

    /* =========================================
       FLYER
       Finished kiosk flyers will eventually be
       2160 x 3840 (9:16 portrait).
       ========================================= */

    #flyer {
      position: absolute;
      inset: 0;

      width: 100%;
      height: 100%;

      object-fit: cover;
      object-position: center;

      display: block;

      opacity: 1;

      transition: opacity 0.3s ease;

      pointer-events: none;
    }

    #flyer.fade {
      opacity: 0;
    }

    /* =========================================
       INVISIBLE LEFT / RIGHT TOUCH ZONES
       ========================================= */

    .touch-zone {
      position: absolute;
      top: 0;
      bottom: 0;
      width: 30%;
      z-index: 10;
      cursor: pointer;
    }

    #previousZone {
      left: 0;
    }

    #nextZone {
      right: 0;
    }

    /* =========================================
       PREVIOUS / NEXT ARROWS
       ========================================= */

    .arrow {
      position: absolute;
      top: 50%;

      transform: translateY(-50%);

      width: 110px;
      height: 150px;

      display: flex;
      align-items: center;
      justify-content: center;

      background: rgba(0, 0, 0, 0.48);
      color: #fff;

      border-radius: 24px;

      font-family: Arial, sans-serif;
      font-size: 80px;

      z-index: 30;

      opacity: 0;
      pointer-events: none;

      transition: opacity 0.25s ease;
    }

    #previousArrow {
      left: 35px;
    }

    #nextArrow {
      right: 35px;
    }

    /* =========================================
       COUNTER
       ========================================= */

    #counter {
      position: absolute;

      bottom: 45px;
      left: 50%;

      transform: translateX(-50%);

      padding: 14px 24px;

      background: rgba(0, 0, 0, 0.5);
      color: #fff;

      border-radius: 40px;

      font-family: Arial, sans-serif;
      font-size: 28px;
      font-weight: bold;

      z-index: 30;

      opacity: 0;
      pointer-events: none;

      transition: opacity 0.25s ease;
    }

    /* =========================================
       HOME BUTTON
       ========================================= */

    #homeButton {
      position: absolute;

      top: 35px;
      left: 35px;

      padding: 18px 28px;

      border: none;
      border-radius: 50px;

      background: rgba(0, 0, 0, 0.55);
      color: #fff;

      font-family: Arial, sans-serif;
      font-size: 25px;
      font-weight: bold;

      text-decoration: none;

      z-index: 40;

      opacity: 0;
      pointer-events: none;

      transition: opacity 0.25s ease;
    }

    /* =========================================
       SHOW CONTROLS
       ========================================= */

    body.controls-visible .arrow,
    body.controls-visible #counter,
    body.controls-visible #homeButton {
      opacity: 1;
    }

    body.controls-visible #homeButton {
      pointer-events: auto;
    }

    /* =========================================
       ERROR MESSAGE
       ========================================= */

    #message {
      position: absolute;
      inset: 0;

      display: none;
      align-items: center;
      justify-content: center;

      padding: 80px;

      background: #3a3e42;
      color: #fff;

      text-align: center;

      font-family: Arial, sans-serif;
      font-size: 40px;

      z-index: 100;
    }
  </style>
</head>

<body>

  <div id="slideshow">

    <img
      id="flyer"
      alt="OLG Event Flyer"
    >

    <div
      id="previousZone"
      class="touch-zone"
      aria-label="Previous flyer"
    ></div>

    <div
      id="nextZone"
      class="touch-zone"
      aria-label="Next flyer"
    ></div>

    <div
      id="previousArrow"
      class="arrow"
    >
      ‹
    </div>

    <div
      id="nextArrow"
      class="arrow"
    >
      ›
    </div>

    <a
      id="homeButton"
      href="index.html"
    >
      ⌂ Home
    </a>

    <div id="counter">
      1 / 1
    </div>

    <div id="message">
      Unable to load event flyer.
    </div>

  </div>


  <script>

    /* ==========================================
       FLYERS

       Add future flyers here.

       Example:

       "flyers/01.png",
       "flyers/02.png",
       "flyers/03.png"

       ========================================== */

    const flyers = [
      "flyers/01.png"
    ];


    /* ==========================================
       SETTINGS
       ========================================== */

    // 15 seconds per flyer

    const AUTO_ADVANCE_TIME = 15000;


    // Controls disappear after 4 seconds

    const CONTROLS_HIDE_TIME = 4000;


    // After somebody manually browses,
    // resume automatic slideshow after 20 seconds

    const RESUME_AUTO_TIME = 20000;


    // Minimum distance for a swipe

    const SWIPE_THRESHOLD = 70;


    /* ==========================================
       ELEMENTS
       ========================================== */

    const flyer =
      document.getElementById("flyer");

    const previousZone =
      document.getElementById("previousZone");

    const nextZone =
      document.getElementById("nextZone");

    const counter =
      document.getElementById("counter");

    const message =
      document.getElementById("message");


    /* ==========================================
       STATE
       ========================================== */

    let currentIndex = 0;

    let autoTimer = null;

    let resumeTimer = null;

    let controlsTimer = null;

    let touchStartX = null;

    let touchStartY = null;


    /* ==========================================
       SHOW CONTROLS
       ========================================== */

    function showControls() {

      document.body.classList.add(
        "controls-visible"
      );

      clearTimeout(controlsTimer);

      controlsTimer =
        setTimeout(() => {

          document.body.classList.remove(
            "controls-visible"
          );

        }, CONTROLS_HIDE_TIME);

    }


    /* ==========================================
       COUNTER
       ========================================== */

    function updateCounter() {

      if (flyers.length === 0) {

        counter.textContent = "0 / 0";

        return;
      }

      counter.textContent =
        `${currentIndex + 1} / ${flyers.length}`;
    }


    /* ==========================================
       LOAD A FLYER
       ========================================== */

    function showFlyer(index, animate = true) {

      if (flyers.length === 0) {

        message.textContent =
          "No event flyers are currently available.";

        message.style.display = "flex";

        return;
      }


      // Loop backward

      if (index < 0) {
        index = flyers.length - 1;
      }


      // Loop forward

      if (index >= flyers.length) {
        index = 0;
      }


      const nextImage = new Image();

      nextImage.onload = () => {

        if (animate) {

          flyer.classList.add("fade");

          setTimeout(() => {

            currentIndex = index;

            flyer.src =
              flyers[currentIndex];

            updateCounter();

            flyer.classList.remove("fade");

          }, 250);

        } else {

          currentIndex = index;

          flyer.src =
            flyers[currentIndex];

          updateCounter();

        }

      };


      nextImage.onerror = () => {

        console.error(
          "Unable to load:",
          flyers[index]
        );

        message.textContent =
          "Unable to load event flyer.";

        message.style.display = "flex";

      };


      nextImage.src =
        flyers[index];
    }


    /* ==========================================
       NEXT
       ========================================== */

    function nextFlyer(manual = false) {

      showFlyer(
        currentIndex + 1
      );

      if (manual) {
        manualInteraction();
      }
    }


    /* ==========================================
       PREVIOUS
       ========================================== */

    function previousFlyer(manual = false) {

      showFlyer(
        currentIndex - 1
      );

      if (manual) {
        manualInteraction();
      }
    }


    /* ==========================================
       AUTOMATIC ROTATION
       ========================================== */

    function startAutoAdvance() {

      clearInterval(autoTimer);

      if (flyers.length <= 1) {
        return;
      }

      autoTimer =
        setInterval(() => {

          nextFlyer(false);

        }, AUTO_ADVANCE_TIME);
    }


    /* ==========================================
       MANUAL INTERACTION
       ========================================== */

    function manualInteraction() {

      showControls();

      clearInterval(autoTimer);

      clearTimeout(resumeTimer);

      resumeTimer =
        setTimeout(() => {

          startAutoAdvance();

        }, RESUME_AUTO_TIME);
    }


    /* ==========================================
       LEFT / RIGHT TAP
       ========================================== */

    previousZone.addEventListener(
      "click",
      () => {

        previousFlyer(true);

      }
    );


    nextZone.addEventListener(
      "click",
      () => {

        nextFlyer(true);

      }
    );


    /* ==========================================
       SWIPE
       ========================================== */

    document.addEventListener(
      "touchstart",
      event => {

        if (!event.touches.length) {
          return;
        }

        touchStartX =
          event.touches[0].clientX;

        touchStartY =
          event.touches[0].clientY;

        showControls();

      },
      {
        passive: true
      }
    );


    document.addEventListener(
      "touchend",
      event => {

        if (touchStartX === null) {
          return;
        }

        const touch =
          event.changedTouches[0];

        const endX =
          touch.clientX;

        const endY =
          touch.clientY;

        const deltaX =
          endX - touchStartX;

        const deltaY =
          endY - touchStartY;


        if (
          Math.abs(deltaX) >
          Math.abs(deltaY) &&
          Math.abs(deltaX) >=
          SWIPE_THRESHOLD
        ) {

          // Swipe left = next

          if (deltaX < 0) {

            nextFlyer(true);

          }

          // Swipe right = previous

          else {

            previousFlyer(true);

          }
        }


        touchStartX = null;
        touchStartY = null;

      },
      {
        passive: true
      }
    );


    /* ==========================================
       KEYBOARD ARROWS
       Useful for testing on computer
       ========================================== */

    document.addEventListener(
      "keydown",
      event => {

        if (
          event.key === "ArrowRight"
        ) {

          nextFlyer(true);

        }


        if (
          event.key === "ArrowLeft"
        ) {

          previousFlyer(true);

        }
      }
    );


    /* ==========================================
       SHOW CONTROLS WHEN SCREEN IS TOUCHED
       ========================================== */

    document.addEventListener(
      "pointerdown",
      () => {

        showControls();

      }
    );


    /* ==========================================
       PRELOAD IMAGES
       ========================================== */

    function preloadFlyers() {

      flyers.forEach(source => {

        const image =
          new Image();

        image.src = source;

      });
    }


    /* ==========================================
       START
       ========================================== */

    function startSlideshow() {

      preloadFlyers();

      showFlyer(
        0,
        false
      );

      startAutoAdvance();
    }


    startSlideshow();

  </script>

</body>
</html>
