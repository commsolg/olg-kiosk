<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
  >

  <title>OLG Kiosk Slideshow</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #000;

      user-select: none;
      -webkit-user-select: none;

      touch-action: none;
    }

    /* ==========================================
       SLIDESHOW
       ========================================== */

    #slideshow {
      position: fixed;
      inset: 0;

      width: 100%;
      height: 100%;

      overflow: hidden;

      background: #000;
    }

    /* ==========================================
       FLYER
       ========================================== */

    #flyer {
      position: absolute;
      inset: 0;

      width: 100%;
      height: 100%;

      object-fit: contain;
      object-position: center;

      display: block;

      background: #000;

      opacity: 1;

      transition: opacity 0.3s ease;

      pointer-events: none;
    }

    #flyer.fade {
      opacity: 0;
    }

    /* ==========================================
       INVISIBLE TOUCH AREAS

       Left = Previous
       Middle = Home
       Right = Next
       ========================================== */

    .touch-zone {
      position: absolute;

      top: 0;
      bottom: 0;

      z-index: 10;
    }

    #leftZone {
      left: 0;
      width: 35%;
    }

    #centerZone {
      left: 35%;
      width: 30%;
    }

    #rightZone {
      right: 0;
      width: 35%;
    }

    /* ==========================================
       HOME BUTTON

       Hidden unless center of screen is tapped.
       ========================================== */

    #homeButton {
      position: fixed;

      bottom: 60px;
      left: 50%;

      transform:
        translateX(-50%)
        translateY(20px);

      padding:
        20px 34px;

      border: none;

      border-radius: 50px;

      background:
        rgba(0, 0, 0, 0.72);

      color: white;

      font-family:
        Arial,
        sans-serif;

      font-size: 26px;
      font-weight: bold;

      text-decoration: none;

      z-index: 100;

      opacity: 0;

      pointer-events: none;

      transition:
        opacity 0.25s ease,
        transform 0.25s ease;
    }

    #homeButton.visible {
      opacity: 1;

      pointer-events: auto;

      transform:
        translateX(-50%)
        translateY(0);
    }

    /* ==========================================
       ERROR MESSAGE
       ========================================== */

    #error {
      position: fixed;

      inset: 0;

      display: none;

      align-items: center;
      justify-content: center;

      padding: 50px;

      background: #3a3e42;

      color: white;

      font-family:
        Arial,
        sans-serif;

      font-size: 30px;

      text-align: center;

      z-index: 200;
    }

  </style>
</head>


<body>

  <div id="slideshow">

    <img
      id="flyer"
      alt="OLG Event Flyer"
    >


    <!-- Invisible navigation -->

    <div
      id="leftZone"
      class="touch-zone"
      aria-label="Previous flyer"
    ></div>


    <div
      id="centerZone"
      class="touch-zone"
      aria-label="Show home button"
    ></div>


    <div
      id="rightZone"
      class="touch-zone"
      aria-label="Next flyer"
    ></div>


    <!-- Home button -->

    <a
      id="homeButton"
      href="index.html"
    >
      ⌂ Home
    </a>

  </div>


  <div id="error">
    Unable to load flyer.
  </div>


  <script>

    // ==========================================
    // OLG FLYERS
    // ==========================================
    //
    // Add future flyers here.
    //
    // Example:
    //
    // "flyers/another-flyer.png",
    //
    // ==========================================

    const flyers = [

      "flyers/ChatGPT Image Sep 29, 2026, 09_41_09 AM.png"

    ];


    // ==========================================
    // SETTINGS
    // ==========================================

    // Automatically change flyer every 15 seconds.

    const AUTO_ADVANCE_TIME = 15000;


    // Home button disappears after 4 seconds.

    const HOME_HIDE_TIME = 4000;


    // Minimum swipe distance.

    const SWIPE_THRESHOLD = 70;


    // ==========================================
    // ELEMENTS
    // ==========================================

    const flyer =
      document.getElementById("flyer");


    const leftZone =
      document.getElementById("leftZone");


    const centerZone =
      document.getElementById("centerZone");


    const rightZone =
      document.getElementById("rightZone");


    const homeButton =
      document.getElementById("homeButton");


    const error =
      document.getElementById("error");


    // ==========================================
    // STATE
    // ==========================================

    let currentIndex = 0;

    let autoTimer = null;

    let homeTimer = null;

    let touchStartX = null;

    let touchStartY = null;

    let touchMoved = false;

    let changingSlide = false;


    // ==========================================
    // SHOW FLYER
    // ==========================================

    function showFlyer(
      index,
      animate = true
    ) {

      if (flyers.length === 0) {

        error.style.display =
          "flex";

        error.textContent =
          "No flyers are currently available.";

        return;

      }


      // Loop backward

      if (index < 0) {

        index =
          flyers.length - 1;

      }


      // Loop forward

      if (index >= flyers.length) {

        index = 0;

      }


      if (changingSlide) {

        return;

      }


      changingSlide = true;


      const nextImage =
        new Image();


      nextImage.onload =
        () => {

          error.style.display =
            "none";


          const finishChange =
            () => {

              currentIndex =
                index;


              flyer.src =
                flyers[currentIndex];


              flyer.classList.remove(
                "fade"
              );


              changingSlide =
                false;

            };


          if (animate) {

            flyer.classList.add(
              "fade"
            );


            setTimeout(
              finishChange,
              250
            );

          }

          else {

            finishChange();

          }

        };


      nextImage.onerror =
        () => {

          console.error(
            "Unable to load:",
            flyers[index]
          );


          changingSlide =
            false;


          error.style.display =
            "flex";


          error.textContent =
            "Unable to load flyer.";

        };


      nextImage.src =
        flyers[index];

    }


    // ==========================================
    // NEXT FLYER
    // ==========================================

    function nextFlyer() {

      showFlyer(
        currentIndex + 1
      );


      restartAutoAdvance();

    }


    // ==========================================
    // PREVIOUS FLYER
    // ==========================================

    function previousFlyer() {

      showFlyer(
        currentIndex - 1
      );


      restartAutoAdvance();

    }


    // ==========================================
    // AUTOMATIC ROTATION
    // ==========================================

    function startAutoAdvance() {

      clearInterval(
        autoTimer
      );


      if (flyers.length <= 1) {

        return;

      }


      autoTimer =
        setInterval(
          () => {

            showFlyer(
              currentIndex + 1
            );

          },

          AUTO_ADVANCE_TIME
        );

    }


    function restartAutoAdvance() {

      clearInterval(
        autoTimer
      );


      startAutoAdvance();

    }


    // ==========================================
    // HOME BUTTON
    // ==========================================

    function showHomeButton() {

      homeButton.classList.add(
        "visible"
      );


      clearTimeout(
        homeTimer
      );


      homeTimer =
        setTimeout(
          () => {

            homeButton.classList.remove(
              "visible"
            );

          },

          HOME_HIDE_TIME
        );

    }


    // ==========================================
    // TAP NAVIGATION
    // ==========================================

    leftZone.addEventListener(
      "click",
      () => {

        if (!touchMoved) {

          previousFlyer();

        }

      }
    );


    rightZone.addEventListener(
      "click",
      () => {

        if (!touchMoved) {

          nextFlyer();

        }

      }
    );


    centerZone.addEventListener(
      "click",
      () => {

        if (!touchMoved) {

          showHomeButton();

        }

      }
    );


    // ==========================================
    // SWIPE START
    // ==========================================

    document.addEventListener(
      "touchstart",

      event => {

        if (!event.touches.length) {

          return;

        }


        touchStartX =
          event.touches[0].clientX;


        touchStartY =
          event.touches[0].clientY;


        touchMoved =
          false;

      },

      {
        passive: true
      }
    );


    // ==========================================
    // SWIPE MOVE
    // ==========================================

    document.addEventListener(
      "touchmove",

      event => {

        if (touchStartX === null) {

          return;

        }


        const currentX =
          event.touches[0].clientX;


        const currentY =
          event.touches[0].clientY;


        const deltaX =
          currentX - touchStartX;


        const deltaY =
          currentY - touchStartY;


        if (
          Math.abs(deltaX) > 15 ||
          Math.abs(deltaY) > 15
        ) {

          touchMoved =
            true;

        }

      },

      {
        passive: true
      }
    );


    // ==========================================
    // SWIPE END
    // ==========================================

    document.addEventListener(
      "touchend",

      event => {

        if (touchStartX === null) {

          return;

        }


        const touch =
          event.changedTouches[0];


        const endX =
          touch.clientX;


        const endY =
          touch.clientY;


        const deltaX =
          endX - touchStartX;


        const deltaY =
          endY - touchStartY;


        if (

          Math.abs(deltaX) >
            Math.abs(deltaY) &&

          Math.abs(deltaX) >=
            SWIPE_THRESHOLD

        ) {


          // Swipe LEFT = next

          if (deltaX < 0) {

            nextFlyer();

          }


          // Swipe RIGHT = previous

          else {

            previousFlyer();

          }

        }


        touchStartX =
          null;


        touchStartY =
          null;


        // Reset after browser finishes
        // processing the touch/click.

        setTimeout(
          () => {

            touchMoved =
              false;

          },

          100
        );

      },

      {
        passive: true
      }
    );


    // ==========================================
    // KEYBOARD SUPPORT
    // ==========================================
    //
    // Useful when testing on your computer.
    // ==========================================

    document.addEventListener(
      "keydown",

      event => {

        if (
          event.key ===
          "ArrowRight"
        ) {

          nextFlyer();

        }


        if (
          event.key ===
          "ArrowLeft"
        ) {

          previousFlyer();

        }


        if (
          event.key ===
          "Enter"
        ) {

          showHomeButton();

        }

      }
    );


    // ==========================================
    // PRELOAD FLYERS
    // ==========================================

    function preloadFlyers() {

      flyers.forEach(
        source => {

          const image =
            new Image();


          image.src =
            source;

        }
      );

    }


    // ==========================================
    // START
    // ==========================================

    function startSlideshow() {

      preloadFlyers();


      showFlyer(
        0,
        false
      );


      startAutoAdvance();

    }


    startSlideshow();

  </script>

</body>
</html>
