<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
  >

  <title>OLG Kiosk Slideshow</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #000;
      user-select: none;
      -webkit-user-select: none;
      touch-action: none;
    }

    #slideshow {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      background: #000;
      overflow: hidden;
    }

    #flyer {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: contain;
      object-position: center;
      display: block;
      background: #000;
      opacity: 1;
      transition: opacity 0.3s ease;
      pointer-events: none;
    }

    #flyer.fade {
      opacity: 0;
    }

    /* Invisible tap areas */
    .touch-zone {
      position: absolute;
      top: 0;
      bottom: 0;
      z-index: 10;
    }

    #leftZone {
      left: 0;
      width: 35%;
    }

    #centerZone {
      left: 35%;
      width: 30%;
    }

    #rightZone {
      right: 0;
      width: 35%;
    }

    /* Home button only appears after tapping center */
    #homeButton {
      position: fixed;
      bottom: 60px;
      left: 50%;
      transform: translateX(-50%) translateY(20px);

      padding: 20px 34px;
      border: none;
      border-radius: 50px;

      background: rgba(0, 0, 0, 0.75);
      color: white;

      font-family: Arial, sans-serif;
      font-size: 26px;
      font-weight: bold;
      text-decoration: none;

      z-index: 100;

      opacity: 0;
      pointer-events: none;

      transition:
        opacity 0.25s ease,
        transform 0.25s ease;
    }

    #homeButton.visible {
      opacity: 1;
      pointer-events: auto;
      transform: translateX(-50%) translateY(0);
    }

    #message {
      position: fixed;
      inset: 0;

      display: flex;
      align-items: center;
      justify-content: center;

      padding: 50px;

      background: #3a3e42;
      color: white;

      font-family: Arial, sans-serif;
      font-size: 30px;
      text-align: center;

      z-index: 200;
    }
  </style>
</head>

<body>

  <div id="slideshow">

    <img id="flyer" alt="OLG Event Flyer">

    <div id="leftZone" class="touch-zone"></div>
    <div id="centerZone" class="touch-zone"></div>
    <div id="rightZone" class="touch-zone"></div>

    <a id="homeButton" href="index.html">
      ⌂ Home
    </a>

  </div>

  <div id="message">
    Loading OLG Flyers...
  </div>


  <script>

    /* =========================
       SETTINGS
       ========================= */

    const CLOUD_NAME = "fxeaggsf";
    const FLYER_TAG = "olg-kiosk";

    // Change flyer every 15 seconds
    const AUTO_ADVANCE_TIME = 15000;

    // Check Cloudinary for new/deleted flyers every 60 seconds
    const REFRESH_TIME = 60000;

    // Hide Home button after 4 seconds
    const HOME_HIDE_TIME = 4000;

    const SWIPE_THRESHOLD = 70;


    /* =========================
       ELEMENTS
       ========================= */

    const flyer = document.getElementById("flyer");
    const message = document.getElementById("message");

    const leftZone = document.getElementById("leftZone");
    const centerZone = document.getElementById("centerZone");
    const rightZone = document.getElementById("rightZone");

    const homeButton = document.getElementById("homeButton");


    /* =========================
       STATE
       ========================= */

    let flyers = [];
    let currentIndex = 0;
    let autoTimer = null;
    let homeTimer = null;

    let touchStartX = null;
    let touchStartY = null;
    let touchMoved = false;


    /* =========================
       CLOUDINARY
       ========================= */

    async function loadFlyers(firstLoad = false) {

      try {

        const listURL =
          `https://res.cloudinary.com/${CLOUD_NAME}/image/list/${FLYER_TAG}.json?t=${Date.now()}`;

        const response = await fetch(listURL, {
          cache: "no-store"
        });

        if (!response.ok) {
          throw new Error("Unable to load Cloudinary flyer list.");
        }

        const data = await response.json();

        if (!data.resources || !Array.isArray(data.resources)) {
          throw new Error("Invalid Cloudinary flyer list.");
        }

        const newFlyers = data.resources.map(resource => {

          /*
            Uses Cloudinary's optimized delivery.
            f_auto = best image format for the kiosk browser
            q_auto = efficient quality without manually compressing
          */

          return (
            `https://res.cloudinary.com/${CLOUD_NAME}/image/upload/` +
            `f_auto,q_auto/` +
            `v${resource.version}/` +
            `${resource.public_id}.${resource.format}`
          );

        });


        if (newFlyers.length === 0) {

          flyers = [];

          message.style.display = "flex";
          message.textContent =
            "No flyers are currently available.";

          clearInterval(autoTimer);

          return;
        }


        const oldCurrentFlyer = flyers[currentIndex];

        flyers = newFlyers;


        /*
          If the current flyer still exists after a refresh,
          keep showing it.
        */

        if (oldCurrentFlyer) {

          const matchingIndex =
            flyers.indexOf(oldCurrentFlyer);

          if (matchingIndex !== -1) {
            currentIndex = matchingIndex;
          }
          else {
            currentIndex = 0;
          }

        }
        else {
          currentIndex = 0;
        }


        preloadFlyers();


        if (firstLoad || !flyer.src) {
          showFlyer(currentIndex, false);
        }


        startAutoAdvance();

      }

      catch (error) {

        console.error("Cloudinary error:", error);

        /*
          If flyers are already running, don't interrupt
          the kiosk because of a temporary internet problem.
        */

        if (flyers.length === 0) {
          message.style.display = "flex";
          message.textContent =
            "Unable to load OLG flyers.";
        }

      }

    }


    /* =========================
       SHOW FLYER
       ========================= */

    function showFlyer(index, animate = true) {

      if (flyers.length === 0) {
        return;
      }

      if (index < 0) {
        index = flyers.length - 1;
      }

      if (index >= flyers.length) {
        index = 0;
      }

      const nextURL = flyers[index];

      const nextImage = new Image();

      nextImage.onload = () => {

        message.style.display = "none";

        const changeImage = () => {

          currentIndex = index;
          flyer.src = nextURL;
          flyer.classList.remove("fade");

        };


        if (animate && flyer.src) {

          flyer.classList.add("fade");

          setTimeout(changeImage, 250);

        }
        else {

          changeImage();

        }

      };


      nextImage.onerror = () => {

        console.error(
          "Unable to load flyer:",
          nextURL
        );

      };


      nextImage.src = nextURL;

    }


    /* =========================
       NEXT / PREVIOUS
       ========================= */

    function nextFlyer() {

      showFlyer(currentIndex + 1);
      restartAutoAdvance();

    }


    function previousFlyer() {

      showFlyer(currentIndex - 1);
      restartAutoAdvance();

    }


    /* =========================
       AUTOMATIC SLIDESHOW
       ========================= */

    function startAutoAdvance() {

      clearInterval(autoTimer);

      if (flyers.length <= 1) {
        return;
      }

      autoTimer = setInterval(() => {

        showFlyer(currentIndex + 1);

      }, AUTO_ADVANCE_TIME);

    }


    function restartAutoAdvance() {

      clearInterval(autoTimer);
      startAutoAdvance();

    }


    /* =========================
       HOME BUTTON
       ========================= */

    function showHomeButton() {

      homeButton.classList.add("visible");

      clearTimeout(homeTimer);

      homeTimer = setTimeout(() => {

        homeButton.classList.remove("visible");

      }, HOME_HIDE_TIME);

    }


    /* =========================
       TAP NAVIGATION
       ========================= */

    leftZone.addEventListener("click", () => {

      if (!touchMoved) {
        previousFlyer();
      }

    });


    rightZone.addEventListener("click", () => {

      if (!touchMoved) {
        nextFlyer();
      }

    });


    centerZone.addEventListener("click", () => {

      if (!touchMoved) {
        showHomeButton();
      }

    });


    /* =========================
       SWIPE NAVIGATION
       ========================= */

    document.addEventListener("touchstart", event => {

      if (!event.touches.length) {
        return;
      }

      touchStartX = event.touches[0].clientX;
      touchStartY = event.touches[0].clientY;
      touchMoved = false;

    }, { passive: true });


    document.addEventListener("touchmove", event => {

      if (touchStartX === null) {
        return;
      }

      const deltaX =
        event.touches[0].clientX - touchStartX;

      const deltaY =
        event.touches[0].clientY - touchStartY;


      if (
        Math.abs(deltaX) > 15 ||
        Math.abs(deltaY) > 15
      ) {

        touchMoved = true;

      }

    }, { passive: true });


    document.addEventListener("touchend", event => {

      if (touchStartX === null) {
        return;
      }

      const touch = event.changedTouches[0];

      const deltaX =
        touch.clientX - touchStartX;

      const deltaY =
        touch.clientY - touchStartY;


      if (
        Math.abs(deltaX) > Math.abs(deltaY) &&
        Math.abs(deltaX) >= SWIPE_THRESHOLD
      ) {

        if (deltaX < 0) {
          nextFlyer();
        }
        else {
          previousFlyer();
        }

      }


      touchStartX = null;
      touchStartY = null;


      setTimeout(() => {
        touchMoved = false;
      }, 100);

    }, { passive: true });


    /* =========================
       KEYBOARD
       ========================= */

    document.addEventListener("keydown", event => {

      if (event.key === "ArrowRight") {
        nextFlyer();
      }

      if (event.key === "ArrowLeft") {
        previousFlyer();
      }

      if (event.key === "Enter") {
        showHomeButton();
      }

    });


    /* =========================
       PRELOAD
       ========================= */

    function preloadFlyers() {

      flyers.forEach(source => {

        const image = new Image();
        image.src = source;

      });

    }


    /* =========================
       START
       ========================= */

    loadFlyers(true);

    /*
      Automatically check Cloudinary every minute.

      This means you don't need to edit GitHub when
      flyers are added or removed.
    */

    setInterval(() => {

      loadFlyers(false);

    }, REFRESH_TIME);

  </script>

</body>
</html>
